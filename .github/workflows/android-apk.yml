name: Build Android APK

# Compila o APK do MAX PERFORMANCE (Capacitor + overlay nativo) e publica
# o arquivo para download em dois lugares:
#   1) Release fixo "apk-latest"  -> link direto .apk
#   2) Artifacts -> MAX-PERFORMANCE-debug-apk
#
# Como gerar: aba Actions -> "Build Android APK" -> Run workflow.

on:
  push:
    branches: [max-performance, appjet]
    paths:
      - 'src/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.config.*'
      - 'index.html'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar APK (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Android SDK (instalação determinística)
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Usando SDK pré-instalado no runner: $SDK"
          else
            echo "SDK pré-instalado ausente; baixando command-line tools..."
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$SDK/cmdline-tools"
            mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          fi
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROID_HOME="$SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tail -5
          echo "--- SDK instalado ---"
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: Dependências web
        run: npm ci

      - name: Build web (dist)
        run: npm run build

      - name: Copiar build web para o app Android
        run: |
          set -e
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -r dist/. android/app/src/main/assets/public/
          cat > android/app/src/main/assets/capacitor.config.json <<'JSON'
          {"appId":"com.maxperformance.nexus","appName":"MAX PERFORMANCE","webDir":"dist","server":{"androidScheme":"https"}}
          JSON
          echo "assets copiados: $(find android/app/src/main/assets/public -type f | wc -l) arquivos"

      - name: Permissão do Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs=-Xmx2g

      - name: Preparar APK com nome final
        run: |
          set -e
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/MAX-PERFORMANCE-v1.0.0-debug.apk
          ls -lh apk

      - name: Publicar como artifact
        uses: actions/upload-artifact@v4
        with:
          name: MAX-PERFORMANCE-debug-apk
          path: apk/MAX-PERFORMANCE-v1.0.0-debug.apk
          if-no-files-found: error

      - name: Publicar no Release (link direto para baixar)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: MAX PERFORMANCE 👑 — APK mais recente
          body: |
            APK debug do MAX PERFORMANCE 👑 gerado automaticamente a partir da branch `${{ github.ref_name }}` (commit `${{ github.sha }}`).

            **Arquivo:** MAX-PERFORMANCE-v1.0.0-debug.apk

            Para instalar no celular: baixe o APK, permita "instalar de fontes desconhecidas"
            e, ao abrir o app, conceda a permissão "Sobrepor outros apps" para a bolinha
            flutuante aparecer durante o Free Fire.
          files: apk/MAX-PERFORMANCE-v1.0.0-debug.apk
          fail_on_unmatched_files: true

      - name: Resumo
        run: |
          echo "### APK gerado ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Arquivo:** MAX-PERFORMANCE-v1.0.0-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Baixe em:" >> $GITHUB_STEP_SUMMARY
          echo "- Release: https://github.com/${{ github.repository }}/releases/tag/apk-latest" >> $GITHUB_STEP_SUMMARY
          echo "- Artifacts: MAX-PERFORMANCE-debug-apk" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Caminho no build: \`android/app/build/outputs/apk/debug/app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
          ls -la apk >> $GITHUB_STEP_SUMMARY
